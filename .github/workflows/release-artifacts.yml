name: release-artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in semver form
        required: true
        default: "0.0.1"
  push:
    tags:
      - "v*"

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected semver like 0.0.1, got: $VERSION" >&2
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release AAB and APK
        run: >
          ./gradlew
          :app:bundleRelease
          :app:assembleRelease
          -PreleaseVersionName=${{ steps.version.outputs.version_name }}
          -PreleaseVersionCode=${{ steps.version.outputs.version_code }}
          --no-daemon

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: no-echat-${{ steps.version.outputs.version_name }}-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: no-echat-${{ steps.version.outputs.version_name }}-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

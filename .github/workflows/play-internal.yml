name: play-internal

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in semver form
        required: true
        default: "0.0.1"
  push:
    tags:
      - "v*"

jobs:
  publish-play-internal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected semver like 0.0.1, got: $VERSION" >&2
            exit 1
          fi

          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for scripts
        run: chmod +x gradlew scripts/publish-play-internal.sh

      - name: Publish signed release bundle to Play internal track
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: ./scripts/publish-play-internal.sh "${{ steps.version.outputs.version_name }}"

      - name: Upload generated bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: no-echat-${{ steps.version.outputs.version_name }}-play-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
